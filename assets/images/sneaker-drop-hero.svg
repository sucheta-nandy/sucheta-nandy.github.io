<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sneaker drop traffic meets distributed systems</title>
  <desc id="desc">A colorful sneaker races toward a checkout button while requests queue in front of servers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111426"/>
      <stop offset="1" stop-color="#22194b"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7de4ef"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1400" cy="120" r="230" fill="#ff5f87" opacity=".13"/>
  <circle cx="110" cy="830" r="260" fill="#7de4ef" opacity=".09"/>
  <text x="92" y="118" fill="#7de4ef" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="5">SYSTEMS DESIGN, BUT MAKE IT STREETWEAR</text>
  <text x="92" y="205" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">50,000 clicks.</text>
  <text x="92" y="280" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">500 pairs.</text>
  <text x="92" y="350" fill="#ffcf5c" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">One very nervous database.</text>

